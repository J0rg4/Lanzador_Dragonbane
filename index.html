<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragonbane PBP - Roller & Iniciativa</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #d97706;
      --text: #f3f4f6;
      --border: #333;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--card);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    h2 {
      margin: 0 0 10px 0;
      color: var(--accent);
      font-size: 1.1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 4px;
      color: #aaa;
    }
    input, select {
      width: 100%;
      padding: 8px;
      background: #000;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .col {
      flex: 1;
    }
    .dice-mix-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      text-align: center;
    }
    .dice-mix-item label {
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 2px;
    }
    button {
      background: #2a2a2a;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:active {
      background: var(--accent);
    }
    .btn-main {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      margin-top: 8px;
    }
    .btn-wa {
      background: #25D366;
      color: #fff;
      border: none;
      width: 100%;
      padding: 10px;
      font-weight: bold;
      margin-top: 8px;
    }
    #result-box {
      background: #000;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      min-height: 48px;
      margin-top: 10px;
      font-size: 0.95rem;
      border: 1px dashed var(--border);
    }
    ol {
      padding-left: 20px;
      margin: 8px 0;
    }
    li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <!-- CONFIGURACIÓN DE JUGADOR -->
  <div class="card">
    <label>Nombre del Jugador / Personaje:</label>
    <input type="text" id="player-name" placeholder="Ej: Grim - El Enano">
  </div>

  <!-- SECCIÓN D20 -->
  <div class="card">
    <h2>🎲 Tirada D20 (Dragonbane)</h2>
    <div class="row">
      <div class="col">
        <label>Modo</label>
        <select id="d20-mode">
          <option value="normal">Normal</option>
          <option value="ventaja">Ventaja</option>
          <option value="desventaja">Desventaja</option>
        </select>
      </div>
      <div class="col">
        <label>Nivel Vent/Desv</label>
        <select id="d20-level">
          <option value="1">1 (2 dados)</option>
          <option value="2">2 (3 dados)</option>
          <option value="3">3 (4 dados)</option>
        </select>
      </div>
    </div>
    <div>
      <label>Bono a la tirada (Ej: +2, -1, etc.)</label>
      <input type="number" id="d20-bonus" value="0">
    </div>
    <button class="btn-main" onclick="rollD20()">Tirar D20</button>
  </div>

  <!-- SECCIÓN OTROS DADOS / DAÑO COMBINADO -->
  <div class="card">
    <h2>🎲 Tirada de Daño / Mezcla de Dados</h2>
    <label>Elige cuántos dados de cada tipo quieres tirar (Ej: 2 D8 + 1 D4):</label>
    <div class="dice-mix-grid">
      <div class="dice-mix-item">
        <label>D4</label>
        <input type="number" id="count-d4" value="0" min="0" max="10">
      </div>
      <div class="dice-mix-item">
        <label>D6</label>
        <input type="number" id="count-d6" value="0" min="0" max="10">
      </div>
      <div class="dice-mix-item">
        <label>D8</label>
        <input type="number" id="count-d8" value="0" min="0" max="10">
      </div>
      <div class="dice-mix-item">
        <label>D10</label>
        <input type="number" id="count-d10" value="0" min="0" max="10">
      </div>
      <div class="dice-mix-item">
        <label>D12</label>
        <input type="number" id="count-d12" value="0" min="0" max="10">
      </div>
    </div>
    <div style="margin-top: 8px;">
      <label>Bono fijo al daño (Ej: +3 o -1):</label>
      <input type="number" id="other-bonus" value="0">
    </div>
    <button class="btn-main" onclick="rollMixedDice()">Tirar Dados Combinados</button>
  </div>

  <!-- PANEL DE RESULTADOS -->
  <div class="card">
    <h2>📋 Resultado</h2>
    <div id="result-box">Realiza una tirada para ver el resultado</div>
    <button id="btn-share-dice" class="btn-wa" style="display:none;" onclick="shareText(lastDiceText)">📲 Compartir en WhatsApp</button>
  </div>

  <!-- SECCIÓN INICIATIVA (DM) -->
  <div class="card">
    <h2>⚔️ Generador de Turnos (DM)</h2>
    <div class="row">
      <div class="col">
        <label>N° Jugadores</label>
        <input type="number" id="num-pj" value="5" min="1">
      </div>
      <div class="col">
        <label>N° Enemigos</label>
        <input type="number" id="num-ene" value="3" min="0">
      </div>
    </div>
    <button class="btn-main" onclick="generateInitiative()">Generar Orden</button>
    
    <div id="init-result" style="display:none; margin-top:10px;">
      <ol id="init-list"></ol>
      <button class="btn-wa" onclick="shareText(lastInitText)">📲 Compartir Iniciativa en WhatsApp</button>
    </div>
  </div>

  <script>
    // REEMPLAZA ESTA URL CON LA DE TU APPS SCRIPT:
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwN5_G_HUel5t66XkeXSkrtomcIY1ALEYZ9b7gMbwaxtdSgKIoPpzfP3gzkNUmViFmNcA/exec";

    let lastDiceText = '';
    let lastInitText = '';

    const nameInput = document.getElementById('player-name');
    nameInput.value = localStorage.getItem('db_player_name') || '';
    nameInput.addEventListener('change', e => localStorage.setItem('db_player_name', e.target.value));

    function getPlayerName() {
      return nameInput.value.trim() || 'Anónimo';
    }

    function sendToSheet(dado, resultado) {
      if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("URL_DE_TU_APPS_SCRIPT")) return;
      fetch(GOOGLE_SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          jugador: getPlayerName(),
          dado: dado,
          resultado: resultado
        })
      }).catch(err => console.error("Error al registrar en Sheet:", err));
    }

    function rollD20() {
      const mode = document.getElementById('d20-mode').value;
      const level = parseInt(document.getElementById('d20-level').value);
      const bonus = parseInt(document.getElementById('d20-bonus').value) || 0;
      const player = getPlayerName();
      
      let numDice = mode === 'normal' ? 1 : 1 + level;
      let rolls = [];
      for (let i = 0; i < numDice; i++) {
        rolls.push(Math.floor(Math.random() * 20) + 1);
      }

      let rawChosen = rolls[0];
      if (mode === 'ventaja') {
        rawChosen = Math.min(...rolls);
      } else if (mode === 'desventaja') {
        rawChosen = Math.max(...rolls);
      }

      let finalVal = rawChosen + bonus;
      let modeTag = mode === 'normal' ? 'Normal' : `${mode.toUpperCase()} (x${level})`;
      let bonusText = bonus !== 0 ? (bonus > 0 ? ` +${bonus}` : ` ${bonus}`) : '';
      
      let textWA = `🎲 *Tirada D20 (${modeTag}${bonusText}) - ${player}*\nDados: [${rolls.join(', ')}]\nResultado: *[${finalVal}]*` + (bonus !== 0 ? ` (Elegido ${rawChosen}${bonusText})` : '');
      let textExcel = `Dados: [${rolls.join(', ')}] -> Elegido: ${rawChosen}${bonusText} = ${finalVal}`;

      lastDiceText = textWA;
      document.getElementById('result-box').innerHTML = textWA.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<b>$1</b>');
      document.getElementById('btn-share-dice').style.display = 'block';

      sendToSheet(`D20 (${modeTag}${bonusText})`, textExcel);
    }

    function rollMixedDice() {
      const diceTypes = [4, 6, 8, 10, 12];
      const player = getPlayerName();
      const bonus = parseInt(document.getElementById('other-bonus').value) || 0;
      
      let allRollsText = [];
      let totalSum = 0;
      let summaryTypes = [];

      diceTypes.forEach(faces => {
        let countInput = document.getElementById(`count-d${faces}`);
        let count = countInput ? (parseInt(countInput.value) || 0) : 0;
        if (count > 0) {
          summaryTypes.push(`${count}D${faces}`);
          let currentRolls = [];
          for (let i = 0; i < count; i++) {
            let r = Math.floor(Math.random() * faces) + 1;
            currentRolls.push(r);
            totalSum += r;
          }
          allRollsText.push(`${count}D${faces}: [${currentRolls.join(', ')}]`);
        }
      });

      if (summaryTypes.length === 0 && bonus === 0) {
        alert("Por favor selecciona al menos 1 dado para tirar.");
        return;
      }

      totalSum += bonus;
      let bonusText = bonus !== 0 ? (bonus > 0 ? ` +${bonus}` : ` ${bonus}`) : '';
      let diceHeader = summaryTypes.length > 0 ? summaryTypes.join(' + ') : 'Bono';

      let textWA = `🎲 *Tirada Daño (${diceHeader}${bonusText}) - ${player}*\n${allRollsText.join('\n')}\nTotal Daño: *[${totalSum}]*`;
      let textExcel = `${allRollsText.join(' | ')}${bonusText} -> Total: ${totalSum}`;

      lastDiceText = textWA;
      document.getElementById('result-box').innerHTML = textWA.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<b>$1</b>');
      document.getElementById('btn-share-dice').style.display = 'block';

      sendToSheet(`Daño (${diceHeader}${bonusText})`, textExcel);
    }

    function generateInitiative() {
      const numPj = parseInt(document.getElementById('num-pj').value) || 0;
      const numEne = parseInt(document.getElementById('num-ene').value) || 0;
      
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let turnos = [];

      for (let i = 0; i < numPj; i++) {
        let letter = letters[i] || (i + 1);
        turnos.push(`Jugador ${letter}`);
      }
      for (let i = 1; i <= numEne; i++) {
        turnos.push(`Enemigo ${i}`);
      }

      for (let i = turnos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [turnos[i], turnos[j]] = [turnos[j], turnos[i]];
      }

      let htmlList = document.getElementById('init-list');
      htmlList.innerHTML = '';
      let waText = '⚔️ *ORDEN DE INICIATIVA*\n';

      turnos.forEach((item, index) => {
        let li = document.createElement('li');
        li.textContent = item;
        htmlList.appendChild(li);
        waText += `${index + 1}. ${item}\n`;
      });

      lastInitText = waText;
      document.getElementById('init-result').style.display = 'block';
    }

    function shareText(text) {
      if (!text) return;
      let url = `https://wa.me/?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
