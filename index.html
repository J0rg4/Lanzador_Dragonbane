<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragonbane PBP - Roller</title>
  <style>
    :root {
      --bg-dark: #0d0b0a;
      --card-bg: #1c1815;
      --card-border: #4a3b2c;
      --gold-accent: #c88b36;
      --text-main: #e8dec8;
      --text-muted: #a3927c;
      --input-bg: #110e0c;
    }
    body {
      font-family: serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 4px;
      border: 2px solid var(--card-border);
    }
    h2 {
      margin: 0 0 12px 0;
      color: var(--gold-accent);
      font-size: 1.1rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 6px;
      text-transform: uppercase;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: var(--text-muted);
    }
    input, select {
      width: 100%;
      padding: 9px;
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 3px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .columns-row {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (min-width: 650px) {
      .columns-row {
        flex-direction: row;
      }
      .columns-row .card {
        flex: 1;
      }
    }
    .row { display: flex; gap: 8px; }
    .col { flex: 1; }
    .btn-main {
      background: linear-gradient(180deg, #c88b36 0%, #8a5a1b 100%);
      color: #000;
      border: 1px solid #e09f45;
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-wa {
      background: #25D366;
      color: #000;
      border: none;
      width: 100%;
      padding: 10px;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
    }
    #result-box {
      background: #090807;
      padding: 14px;
      border-radius: 3px;
      text-align: center;
      min-height: 48px;
      margin-top: 10px;
      border: 1px dashed var(--card-border);
    }
  </style>
</head>
<body>

  <div class="card">
    <label>Nombre del Personaje:</label>
    <input type="text" id="player-name" placeholder="Ej: Rayo, Trueno, Árbol...">
  </div>

  <div class="columns-row">
    <div class="card">
      <h2>🎲 Tirada D20</h2>
      <div class="row">
        <div class="col">
          <label>Modo</label>
          <select id="d20-mode">
            <option value="normal">Normal</option>
            <option value="ventaja">Ventaja</option>
            <option value="desventaja">Desventaja</option>
          </select>
        </div>
        <div class="col">
          <label>Nivel</label>
          <select id="d20-level">
            <option value="1">Nivel 1</option>
            <option value="2">Nivel 2</option>
            <option value="3">Nivel 3</option>
          </select>
        </div>
      </div>
      <button class="btn-main" onclick="rollD20()">Tirar D20</button>
    </div>

    <div class="card">
      <h2>⚔️ Tirada de Daño</h2>
      <div class="row">
        <div class="col" style="flex: 0.5;">
          <label>Cant.</label>
          <input type="number" id="weapon-count" value="1" min="1" max="10">
        </div>
        <div class="col">
          <label>Dado Base</label>
          <select id="weapon-dice">
            <option value="4">D4</option>
            <option value="6">D6</option>
            <option value="8" selected>D8</option>
            <option value="10">D10</option>
            <option value="12">D12</option>
          </select>
        </div>
      </div>
      <div>
        <label>Dado Extra</label>
        <select id="extra-damage">
          <option value="0">Ninguno</option>
          <option value="4">+ 1 D4</option>
          <option value="6">+ 1 D6</option>
        </select>
      </div>
      <button class="btn-main" onclick="rollDamage()">Tirar Daño</button>
    </div>
  </div>

  <div class="card">
    <h2>📜 Resultado</h2>
    <div id="result-box">Haz una tirada para ver el resultado</div>
    <button id="btn-share-dice" class="btn-wa" style="display:none;" onclick="shareText()">📲 Compartir en WhatsApp</button>
  </div>

  <script>
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwN5_G_HUel5t66XkeXSkrtomcIY1ALEYZ9b7gMbwaxtdSgKIoPpzfP3gzkNUmViFmNcA/exec";
    let lastText = '';

    function getPlayerName() {
      return document.getElementById('player-name').value.trim();
    }

    function rollD20() {
      const name = getPlayerName();
      if (!name) { alert("Escribe tu nombre"); return; }
      const mode = document.getElementById('d20-mode').value;
      const level = parseInt(document.getElementById('d20-level').value);
      let num = mode === 'normal' ? 1 : 1 + level;
      let rolls = [];
      for(let i=0; i<num; i++) rolls.push(Math.floor(Math.random()*20)+1);
      let chosen = mode === 'ventaja' ? Math.min(...rolls) : (mode === 'desventaja' ? Math.max(...rolls) : rolls[0]);
      
      lastText = `🎲 D20 (${mode}) - ${name}\nDados: [${rolls.join(', ')}]\nResultado: *[${chosen}]*`;
      document.getElementById('result-box').innerText = lastText;
      document.getElementById('btn-share-dice').style.display = 'block';
    }

    function rollDamage() {
      const name = getPlayerName();
      if (!name) { alert("Escribe tu nombre"); return; }
      const count = parseInt(document.getElementById('weapon-count').value) || 1;
      const faces = parseInt(document.getElementById('weapon-dice').value);
      const extra = parseInt(document.getElementById('extra-damage').value);
      
      let rolls = [];
      let total = 0;
      for(let i=0; i<count; i++) {
        let r = Math.floor(Math.random()*faces)+1;
        rolls.push(r);
        total += r;
      }
      let desc = `${count}D${faces}: [${rolls.join(', ')}]`;
      if(extra > 0) {
        let extR = Math.floor(Math.random()*extra)+1;
        total += extR;
        desc += ` | +1D${extra}: [${extR}]`;
      }
      
      lastText = `⚔️ Daño - ${name}\n${desc}\nTotal: *[${total}]*`;
      document.getElementById('result-box').innerText = lastText;
      document.getElementById('btn-share-dice').style.display = 'block';
    }

    function shareText() {
      if(!lastText) return;
      window.open(`https://wa.me/?text=${encodeURIComponent(lastText)}`, '_blank');
    }
  </script>
</body>
</html>
