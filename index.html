<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragonbane PBP - Roller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=MedievalSharp&family=Spectral:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-bone: #e8dfca;
      --card-bg: #f5efe1;
      --card-border: #8c765c;
      --green-dragon: #1b4d2e;
      --red-dragon: #8b1e1e;
      --text-dark: #241d18;
      --text-muted: #5c4e40;
      --input-bg: #fbf8f1;
    }
    
    body {
      font-family: 'Spectral', serif;
      background-color: var(--bg-bone);
      background-image: 
        radial-gradient(#d4c5a9 1px, transparent 0),
        radial-gradient(#c2b093 1px, transparent 0);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      color: var(--text-dark);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    h2 {
      font-family: 'Cinzel', serif;
      margin: 0 0 12px 0;
      color: var(--green-dragon);
      font-size: 1.05rem;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 3px;
      border: 2px solid var(--card-border);
      box-shadow: inset 0 0 8px rgba(140, 118, 92, 0.2), 0 3px 8px rgba(0,0,0,0.15);
    }

    label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 4px;
      color: var(--red-dragon);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      background: var(--input-bg);
      color: var(--text-dark);
      border: 1px solid var(--card-border);
      border-radius: 2px;
      box-sizing: border-box;
      margin-bottom: 10px;
      font-family: 'Spectral', serif;
      font-size: 0.95rem;
      font-weight: 600;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--red-dragon);
    }

    /* CONTENEDOR DOBLE 50/50 */
    .columns-row {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 650px) {
      .columns-row {
        flex-direction: row;
      }
      .columns-row .card {
        flex: 1;
      }
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .col {
      flex: 1;
    }

    button {
      background: var(--green-dragon);
      color: #f5efe1;
      border: 1px solid #10301c;
      padding: 10px;
      border-radius: 2px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.15s;
    }

    button:hover {
      background: #25663e;
    }

    .btn-main {
      background: var(--red-dragon);
      border: 1px solid #571212;
      color: #f5efe1;
      width: 100%;
      padding: 11px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .btn-main:hover {
      background: #a62424;
    }

    .btn-wa {
      background: #1e592f;
      color: #ffffff;
      border: 1px solid #11361c;
      width: 100%;
      padding: 10px;
      font-family: 'Cinzel', serif;
      margin-top: 8px;
    }

    .btn-wa:hover {
      background: #256e3b;
    }

    #result-box {
      background: #fbf8f1;
      padding: 12px;
      border-radius: 2px;
      text-align: center;
      min-height: 44px;
      margin-top: 10px;
      font-size: 1rem;
      border: 1px dashed var(--card-border);
      color: var(--text-dark);
      font-family: 'MedievalSharp', cursive;
    }

    ol {
      padding-left: 20px;
      margin: 8px 0;
      font-weight: 600;
    }

    li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <!-- JUGADOR -->
  <div class="card">
    <label>Nombre del Personaje</label>
    <input type="text" id="player-name" placeholder="Ej: Rayo, Trueno, Árbol...">
  </div>

  <!-- D20 Y DAÑO (50/50) -->
  <div class="columns-row">
    
    <!-- D20 -->
    <div class="card">
      <h2>🎲 Tirada D20</h2>
      <div class="row">
        <div class="col">
          <label>Modo</label>
          <select id="d20-mode">
            <option value="normal">Normal (1 Dado)</option>
            <option value="ventaja">Ventaja</option>
            <option value="desventaja">Desventaja</option>
          </select>
        </div>
        <div class="col">
          <label>Dados Adicionales</label>
          <select id="d20-level">
            <option value="1">1 Dado Extra</option>
            <option value="2">2 Dados Extra</option>
            <option value="3">3 Dados Extra</option>
          </select>
        </div>
      </div>
      <button class="btn-main" onclick="rollD20()">Tirar D20</button>
    </div>

    <!-- DAÑO -->
    <div class="card">
      <h2>⚔️ Tirada de Daño</h2>
      <div class="row">
        <div class="col" style="flex: 0.6;">
          <label>Cant.</label>
          <input type="number" id="weapon-count" value="1" min="1" max="10">
        </div>
        <div class="col">
          <label>Dado Base</label>
          <select id="weapon-dice">
            <option value="4">D4</option>
            <option value="6">D6</option>
            <option value="8" selected>D8</option>
            <option value="10">D10</option>
            <option value="12">D12</option>
          </select>
        </div>
      </div>
      <div>
        <label>Dado Extra (Bono)</label>
        <select id="extra-damage">
          <option value="0">Ninguno</option>
          <option value="4">+ 1 D4</option>
          <option value="6">+ 1 D6</option>
        </select>
      </div>
      <button class="btn-main" onclick="rollDamage()">Tirar Daño</button>
    </div>

  </div>

  <!-- RESULTADO -->
  <div class="card">
    <h2>📜 Resultado</h2>
    <div id="result-box">Realiza una tirada</div>
    <button id="btn-share-dice" class="btn-wa" style="display:none;" onclick="shareText(lastDiceText)">📲 Compartir en WhatsApp</button>
  </div>

  <!-- INICIATIVA CON NOMBRES REALES -->
  <div class="card">
    <h2>⚔️ Generador de Iniciativa (DM)</h2>
    <div class="row">
      <div class="col">
        <label>N° Enemigos</label>
        <input type="number" id="num-ene" value="3" min="0">
      </div>
    </div>
    <button class="btn-main" onclick="generateInitiative()">Generar Orden con Jugadores Reales</button>
    
    <div id="init-result" style="display:none; margin-top:10px;">
      <ol id="init-list"></ol>
      <button class="btn-wa" onclick="shareText(lastInitText)">📲 Compartir Iniciativa</button>
    </div>
  </div>

  <script>
    // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT:
    const GOOGLE_SHEET_URL = "URL_DE_TU_APPS_SCRIPT_AQUI";
    
    let lastDiceText = '';
    let lastInitText = '';

    const nameInput = document.getElementById('player-name');
    nameInput.value = localStorage.getItem('db_player_name') || '';
    nameInput.addEventListener('change', e => localStorage.setItem('db_player_name', e.target.value));

    function getPlayerName() {
      return nameInput.value.trim();
    }

    function sendToSheet(dado, resultado) {
      const name = getPlayerName();
      if (!name) return;
      if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("URL_DE_TU_APPS_SCRIPT")) return;
      fetch(GOOGLE_SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jugador: name, dado: dado, resultado: resultado })
      }).catch(err => console.error("Error Sheet:", err));
    }

    function rollD20() {
      const player = getPlayerName();
      if (!player) { alert("Escribe el nombre de tu personaje."); return; }

      const mode = document.getElementById('d20-mode').value;
      const level = parseInt(document.getElementById('d20-level').value);
      
      let numDice = mode === 'normal' ? 1 : 1 + level;
      let rolls = [];
      for (let i = 0; i < numDice; i++) {
        rolls.push(Math.floor(Math.random() * 20) + 1);
      }

      let chosen = rolls[0];
      if (mode === 'ventaja') chosen = Math.min(...rolls);
      else if (mode === 'desventaja') chosen = Math.max(...rolls);

      let modeTag = mode === 'normal' ? 'Normal' : `${mode.toUpperCase()} (${level} Adic.)`;
      let textWA = `🎲 *D20 (${modeTag}) - ${player}*\nDados: [${rolls.join(', ')}]\nResultado: *[${chosen}]*`;
      let textExcel = `Dados: [${rolls.join(', ')}] -> Elegido: ${chosen}`;

      lastDiceText = textWA;
      document.getElementById('result-box').innerHTML = textWA.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<b>$1</b>');
      document.getElementById('btn-share-dice').style.display = 'block';

      sendToSheet(`D20 (${modeTag})`, textExcel);
    }

    function rollDamage() {
      const player = getPlayerName();
      if (!player) { alert("Escribe el nombre de tu personaje."); return; }

      const count = Math.max(1, parseInt(document.getElementById('weapon-count').value) || 1);
      const weaponFaces = parseInt(document.getElementById('weapon-dice').value);
      const extraFaces = parseInt(document.getElementById('extra-damage').value);

      let weaponRolls = [];
      let totalSum = 0;

      for (let i = 0; i < count; i++) {
        let r = Math.floor(Math.random() * weaponFaces) + 1;
        weaponRolls.push(r);
        totalSum += r;
      }

      let rollDesc = `${count}D${weaponFaces}: [${weaponRolls.join(', ')}]`;
      let diceHeader = `${count}D${weaponFaces}`;

      if (extraFaces > 0) {
        let extraRoll = Math.floor(Math.random() * extraFaces) + 1;
        totalSum += extraRoll;
        rollDesc += ` | +1D${extraFaces}: [${extraRoll}]`;
        diceHeader += ` + 1D${extraFaces}`;
      }

      let textWA = `⚔️ *Daño (${diceHeader}) - ${player}*\n${rollDesc}\nTotal: *[${totalSum}]*`;
      let textExcel = `${rollDesc} -> Total: ${totalSum}`;

      lastDiceText = textWA;
      document.getElementById('result-box').innerHTML = textWA.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<b>$1</b>');
      document.getElementById('btn-share-dice').style.display = 'block';

      sendToSheet(`Daño (${diceHeader})`, textExcel);
    }

    async function generateInitiative() {
      const numEne = parseInt(document.getElementById('num-ene').value) || 0;
      let jugadores = [];

      // Intentar obtener los jugadores reales desde Google Sheets
      if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("URL_DE_TU_APPS_SCRIPT")) {
        try {
          let res = await fetch(`${GOOGLE_SHEET_URL}?action=getJugadores`);
          let data = await res.json();
          if (data && data.jugadores && data.jugadores.length > 0) {
            jugadores = data.jugadores;
          }
        } catch (e) {
          console.log("No se pudo conectar con Sheet para traer nombres, usando genéricos.");
        }
      }

      // Si no se encontraron nombres o no hay conexión, usa genéricos
      if (jugadores.length === 0) {
        jugadores = ["Jugador A", "Jugador B", "Jugador C", "Jugador D", "Jugador E"];
      }

      let turnos = [...jugadores];
      for (let i = 1; i <= numEne; i++) {
        turnos.push(`Enemigo ${i}`);
      }

      // Mezclar turnos al azar
      for (let i = turnos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [turnos[i], turnos[j]] = [turnos[j], turnos[i]];
      }

      let htmlList = document.getElementById('init-list');
      htmlList.innerHTML = '';
      let waText = '⚔️ *ORDEN DE INICIATIVA*\n';

      turnos.forEach((item, index) => {
        let li = document.createElement('li');
        li.textContent = item;
        htmlList.appendChild(li);
        waText += `${index + 1}. ${item}\n`;
      });

      lastInitText = waText;
      document.getElementById('init-result').style.display = 'block';
    }

    function shareText(text) {
      if (!text) return;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }
  </script>
</body>
</html>
