<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragonbane PBP - Roller & Iniciativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=MedievalSharp&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0d0b0a;
      --card-bg: #1c1815;
      --card-border: #4a3b2c;
      --gold-accent: #c88b36;
      --gold-hover: #e09f45;
      --red-accent: #7a1c1c;
      --text-main: #e8dec8;
      --text-muted: #a3927c;
      --input-bg: #110e0c;
    }
    
    body {
      font-family: 'Spectral', serif;
      background-color: var(--bg-dark);
      background-image: radial-gradient(#261e17 1px, transparent 0);
      background-size: 16px 16px;
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    h1, h2 {
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
    }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 4px;
      border: 2px solid var(--card-border);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 4px 12px rgba(0,0,0,0.5);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 2px; left: 2px; right: 2px; bottom: 2px;
      border: 1px solid rgba(200, 139, 54, 0.15);
      pointer-events: none;
    }

    h2 {
      margin: 0 0 12px 0;
      color: var(--gold-accent);
      font-size: 1.1rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 6px;
      text-transform: uppercase;
      text-shadow: 1px 1px 2px #000;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: var(--text-muted);
      font-family: 'Spectral', serif;
    }

    input, select {
      width: 100%;
      padding: 9px;
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 3px;
      box-sizing: border-box;
      margin-bottom: 10px;
      font-family: 'Spectral', serif;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--gold-accent);
      box-shadow: 0 0 5px rgba(200, 139, 54, 0.4);
    }

    /* FILA DOBLE 50/50 EN PANTALLAS MEDIANAS/GRANDES */
    .columns-row {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 650px) {
      .columns-row {
        flex-direction: row;
      }
      .columns-row .card {
        flex: 1;
      }
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .col {
      flex: 1;
    }

    button {
      background: linear-gradient(180deg, #3a2e24 0%, #241c16 100%);
      color: var(--text-main);
      border: 1px solid var(--gold-accent);
      padding: 10px;
      border-radius: 3px;
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.15s ease;
    }

    button:hover {
      background: var(--gold-accent);
      color: #000;
    }

    .btn-main {
      background: linear-gradient(180deg, #c88b36 0%, #8a5a1b 100%);
      color: #000;
      border: 1px solid #e09f45;
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      margin-top: 8px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    }

    .btn-main:hover {
      background: linear-gradient(180deg, #e09f45 0%, #a36c22 100%);
      box-shadow: 0 0 8px rgba(200, 139, 54, 0.6);
    }

    .btn-wa {
      background: linear-gradient(180deg, #1e592f 0%, #11361c 100%);
      color: #a3f0b5;
      border: 1px solid #25D366;
      width: 100%;
      padding: 10px;
      font-family: 'Cinzel', serif;
      margin-top: 8px;
    }

    .btn-wa:hover {
      background: #25D366;
      color: #000;
    }

    #result-box {
      background: #090807;
      padding: 14px;
      border-radius: 3px;
      text-align: center;
      min-height: 48px;
      margin-top: 10px;
      font-size: 1rem;
      border: 1px dashed var(--card-border);
      color: #f0e6d2;
      font-family: 'MedievalSharp', cursive;
      letter-spacing: 0.5px;
    }

    ol {
      padding-left: 20px;
      margin: 8px 0;
    }

    li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <!-- CONFIGURACIÓN DE JUGADOR -->
  <div class="card">
    <label>Nombre del Jugador / Personaje:</label>
    <input type="text" id="player-name" placeholder="Ej: Rayo, Trueno, Árbol...">
  </div>

  <!-- CONTENEDOR 50/50: D20 Y DAÑO LADO A LADO -->
  <div class="columns-row">
    
    <!-- SECCIÓN D20 -->
    <div class="card">
      <h2>🎲 Tirada D20</h2>
      <div class="row">
        <div class="col">
          <label>Modo</label>
          <select id="d20-mode">
            <option value="normal">Normal (1 Dado)</option>
            <option value="ventaja">Ventaja</option>
            <option value="desventaja">Desventaja</option>
          </select>
        </div>
        <div class="col">
          <label>Nivel Vent/Desv</label>
          <select id="d20-level">
            <option value="1">Nivel 1 (2 dados)</option>
            <option value="2">Nivel 2 (3 dados)</option>
            <option value="3">Nivel 3 (4 dados)</option>
          </select>
        </div>
      </div>
      <button class="btn-main" onclick="rollD20()">Tirar D20</button>
    </div>

    <!-- SECCIÓN DAÑO -->
    <div class="card">
      <h2>⚔️ Tirada de Daño</h2>
      <div class="row">
        <div class="col" style="flex: 0.6;">
          <label>Cant.</label>
          <input type="number" id="weapon-count" value="1" min="1" max="10">
        </div>
        <div class="col">
          <label>Dado Base</label>
          <select id="weapon-dice">
            <option value="4">D4</option>
            <option value="6">D6</option>
            <option value="8" selected>D8</option>
            <option value="10">D10</option>
            <option value="12">D12</option>
          </select>
        </div>
      </div>
      <div>
        <label>Dado Extra (Bono)</label>
        <select id="extra-damage">
          <option value="0">Ninguno</option>
          <option value="4">+ 1 D4</option>
          <option value="6">+ 1 D6</option>
        </select>
      </div>
      <button class="btn-main" onclick="rollDamage()">Tirar Daño</button>
    </div>

  </div>

  <!-- PANEL DE RESULTADOS -->
  <div class="card">
    <h2>📜 Resultado</h2>
    <div id="result-box">Haz una tirada para ver el resultado</div>
    <button id="btn-share-dice" class="btn-wa" style="display:none;" onclick="shareText(lastDiceText)">📲 Compartir en WhatsApp</button>
  </div>

  <!-- SECCIÓN INICIATIVA (DM) -->
  <div class="card">
    <h2>⚔️ Generador de Turnos (DM)</h2>
    <div class="row">
      <div class="col">
        <label>N° Jugadores</label>
        <input type="number" id="num-pj" value="5" min="1">
      </div>
      <div class="col">
        <label>N° Enemigos</label>
        <input type="number" id="num-ene" value="3" min="0">
      </div>
    </div>
    <button class="btn-main" onclick="generateInitiative()">Generar Orden</button>
    
    <div id="init-result" style="display:none; margin-top:10px;">
      <ol id="init-list"></ol>
      <button class="btn-wa" onclick="shareText(lastInitText)">📲 Compartir Iniciativa en WhatsApp</button>
    </div>
  </div>

  <script>
    // REEMPLAZA ESTA URL CON LA DE TU GOOGLE APPS SCRIPT:
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwN5_G_HUel5t66XkeXSkrtomcIY1ALEYZ9b7gMbwaxtdSgKIoPpzfP3gzkNUmViFmNcA/exec";

    let lastDiceText = '';
    let lastInitText = '';

    const nameInput = document.getElementById('player-name');
    nameInput.value = localStorage.getItem('db_player_name') || '';
    nameInput.addEventListener('change', e => localStorage.setItem('db_player_name', e.target.value));

    function getPlayerName() {
      return nameInput.value.trim();
    }

    function sendToSheet(dado, resultado) {
      const name = getPlayerName();
      if (!name) return; // Si está vacío no envía

      if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("URL_DE_TU_APPS_SCRIPT")) return;
      fetch(GOOGLE_SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          jugador: name,
          dado: dado,
          resultado: resultado
        })
      }).catch(err => console.error("Error al registrar en Sheet:", err));
    }

    function rollD20() {
      const player = getPlayerName();
      if (!player) {
        alert("Por favor escribe el nombre de tu personaje antes de tirar.");
        return;
      }

      const mode = document.getElementById('d20-mode').value;
      const level = parseInt(document.getElementById('d20-level').value);
      
      let numDice = mode === 'normal' ? 1 : 1 + level;
      let rolls = [];
      for (let i = 0; i < numDice; i++) {
        rolls.push(Math.floor(Math.random() * 20) + 1);
      }

      let chosen = rolls[0];
      if (mode === 'ventaja') {
        chosen = Math.min(...rolls);
      } else if (mode === 'desventaja') {
        chosen = Math.max(...rolls);
      }

      let modeTag = mode === 'normal' ? 'Normal' : `${mode.toUpperCase()} (Nivel ${level})`;
      let textWA = `🎲 *Tirada D20 (${modeTag}) - ${player}*\nDados: [${rolls.join(', ')}]\nResultado: *[${chosen}]*`;
      let textExcel = `Dados: [${rolls.join(', ')}] -> Elegido: ${chosen}`;

      lastDiceText = textWA;
      document.getElementById('result-box').innerHTML = textWA.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<b>$1</b>');
      document.getElementById('btn-share-dice').style.display = 'block';

      sendToSheet(`D20 (${modeTag})`, textExcel);
    }

    function rollDamage() {
      const player = getPlayerName();
      if (!player) {
        alert("Por favor escribe el nombre de tu personaje antes de tirar.");
        return;
      }

      const count = Math.max(1, parseInt(document.getElementById('weapon-count').value) || 1);
      const weaponFaces = parseInt(document.getElementById('weapon-dice').value);
      const extraFaces = parseInt(document.getElementById('extra-damage').value);

      let weaponRolls = [];
      let totalSum = 0;

      for (let i = 0; i < count; i++) {
        let r = Math.floor(Math.random() * weaponFaces) + 1;
        weaponRolls.push(r);
        totalSum += r;
      }

      let rollDesc = `${count}D${weaponFaces}: [${weaponRolls.join(', ')}]`;
      let diceHeader = `${count}D${weaponFaces}`;

      if (extraFaces > 0) {
        let extraRoll = Math.floor(Math.random() * extraFaces) + 1;
        totalSum += extraRoll;
        rollDesc += ` | +1D${extraFaces}: [${extraRoll}]`;
        diceHeader += ` + 1D${extraFaces}`;
      }

      let textWA = `⚔️ *Tirada Daño (${diceHeader}) - ${player}*\n${rollDesc}\nTotal Daño: *[${totalSum}]*`;
      let textExcel = `${rollDesc} -> Total Daño: ${totalSum}`;

      lastDiceText = textWA;
      document.getElementById('result-box').innerHTML = textWA.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<b>$1</b>');
      document.getElementById('btn-share-dice').style.display = 'block';

      sendToSheet(`Daño (${diceHeader})`, textExcel);
    }

    function generateInitiative() {
      const numPj = parseInt(document.getElementById('num-pj').value) || 0;
      const numEne = parseInt(document.getElementById('num-ene').value) || 0;
      
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let turnos = [];

      for (let i = 0; i < numPj; i++) {
        let letter = letters[i] || (i + 1);
        turnos.push(`Jugador ${letter}`);
      }
      for (let i = 1; i <= numEne; i++) {
        turnos.push(`Enemigo ${i}`);
      }

      for (let i = turnos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [turnos[i], turnos[j]] = [turnos[j], turnos[i]];
      }

      let htmlList = document.getElementById('init-list');
      htmlList.innerHTML = '';
      let waText = '⚔️ *ORDEN DE INICIATIVA*\n';

      turnos.forEach((item, index) => {
        let li = document.createElement('li');
        li.textContent = item;
        htmlList.appendChild(li);
        waText += `${index + 1}. ${item}\n`;
      });

      lastInitText = waText;
      document.getElementById('init-result').style.display = 'block';
    }

    function shareText(text) {
      if (!text) return;
      let url = `https://wa.me/?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
